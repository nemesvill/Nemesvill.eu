<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Nemesvill – Admin képfeltöltés</title><link rel="stylesheet" href="styles.css"><style>
.admin-wrap{max-width:900px;margin:50px auto;padding:24px}.admin-panel{background:#111d2a;border:1px solid #294254;border-radius:16px;padding:24px;margin:18px 0}.admin-panel input,.admin-panel select{width:100%;padding:12px;border-radius:8px;border:1px solid #3a5668;background:#0b1420;color:#fff;margin:8px 0 16px}.admin-panel button{cursor:pointer;border:0;border-radius:8px;padding:12px 18px;background:#35c5bd;color:#07131b;font-weight:700;margin:6px 6px 6px 0}.admin-status{min-height:24px;color:#a7e8e1}.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.admin-photo{border:1px solid #294254;border-radius:10px;padding:10px;overflow:hidden}.admin-photo img{width:100%;height:150px;object-fit:cover;border-radius:6px}.hidden{display:none!important}
</style></head><body><main class="admin-wrap"><a href="index.html">← Vissza a weboldalra</a><h1>Védett képfeltöltő</h1><p>Új referenciafotók feltöltése a Nemesvill weboldalára.</p><section class="admin-panel" id="login-panel"><h2>Admin belépés</h2><form id="login-form"><label for="password">Admin jelszó</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Belépés</button></form></section><section id="dashboard" class="hidden"><section class="admin-panel"><h2>Kép feltöltése</h2><form id="upload-form"><label for="category">Galéria</label><select id="category" required><option value="villanyszereles">Villanyszerelés</option><option value="klimaszereles">Klímaszerelés</option><option value="ev-toltok">EV-töltők</option></select><label for="label">Kép megnevezése (nem kötelező)</label><input id="label" maxlength="120" placeholder="Pl. Elosztócsere Dunaújvárosban"><label for="file">Kép (JPG, PNG, WebP vagy AVIF, max. 10 MB)</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/avif" required><button type="submit">Kép feltöltése</button></form><p class="admin-status" id="status" role="status"></p></section><section class="admin-panel"><h2>Feltöltött képek</h2><label for="filter-category">Galéria kiválasztása</label><select id="filter-category"><option value="villanyszereles">Villanyszerelés</option><option value="klimaszereles">Klímaszerelés</option><option value="ev-toltok">EV-töltők</option></select><div id="photos" class="admin-grid"></div><button id="logout" type="button">Kilépés</button></section></section></main><script>
const API='https://api.nemesvill.eu';const $=id=>document.getElementById(id);const cats={villanyszereles:'Villanyszerelés',klimaszereles:'Klímaszerelés','ev-toltok':'EV-töltők'};
async function call(path,options={}){const r=await fetch(API+path,{credentials:'include',...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Hiba történt');return d}
function showAdmin(){ $('login-panel').classList.add('hidden');$('dashboard').classList.remove('hidden');loadPhotos(); }
async function check(){try{await call('/api/admin/check');showAdmin()}catch{}}
$('login-form').addEventListener('submit',async e=>{e.preventDefault();$('status').textContent='';try{await call('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});$('password').value='';showAdmin()}catch(err){alert(err.message)}});
$('upload-form').addEventListener('submit',async e=>{e.preventDefault();const f=$('file').files[0];if(!f)return;const data=new FormData();data.append('file',f);data.append('category',$('category').value);data.append('label',$('label').value);$('status').textContent='Feltöltés folyamatban…';try{await call('/api/upload',{method:'POST',body:data});$('status').textContent='Sikeres feltöltés.';$('file').value='';$('label').value='';$('filter-category').value=$('category').value;await loadPhotos()}catch(err){$('status').textContent=err.message}});
$('filter-category').addEventListener('change',loadPhotos);$('logout').addEventListener('click',async()=>{try{await call('/api/logout',{method:'POST'})}finally{location.reload()}});
async function loadPhotos(){const el=$('photos');el.innerHTML='Betöltés…';try{const data=await call('/api/gallery?category='+encodeURIComponent($('filter-category').value));el.innerHTML='';if(!data.items.length){el.textContent='Ebben a galériában még nincs feltöltött kép.';return}for(const p of data.items){const card=document.createElement('article');card.className='admin-photo';const img=document.createElement('img');img.src=p.url;img.alt=p.name;const title=document.createElement('p');title.textContent=p.name;const del=document.createElement('button');del.type='button';del.textContent='Törlés';del.addEventListener('click',async()=>{if(!confirm('Biztosan törlöd ezt a képet?'))return;try{await call('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:p.key})});await loadPhotos()}catch(e){alert(e.message)}});card.append(img,title,del);el.append(card)}}catch(err){el.textContent=err.message}}
check();
</script></body></html>
