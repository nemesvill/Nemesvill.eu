name: Inspect Nemesvill CRM D1 schema

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inspect production D1 tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 d1 execute nemesvill-crm --remote --json --command="SELECT name, sql FROM sqlite_master WHERE type IN ('table','index') ORDER BY type, name;" | tee d1-schema-output.txt
          echo "---- D1 SCHEMA OUTPUT ----"
          cat d1-schema-output.txt
